services:
  - type: web
    name: autosovereign
    env: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma db push && node prisma/seed.js && npm run start
    envVars:
      - { key: DATABASE_URL, value: "file:./dev.db" }
      - { key: PAYPAL_API_BASE, value: "https://api-m.sandbox.paypal.com" }
      - { key: PAYPAL_CLIENT_ID, sync: false }
      - { key: NEXT_PUBLIC_PAYPAL_CLIENT_ID, sync: false }
      - { key: PAYPAL_CLIENT_SECRET, sync: false }
      - { key: PAYPAL_WEBHOOK_ID, sync: false }
      - { key: GROQ_API_KEY, sync: false }
      - { key: SELLER_PAYPAL_EMAIL, sync: false }